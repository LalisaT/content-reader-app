<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="meta-title">TipPulse — Executive Career Vacancy</title>
  
  <!-- Open Graph / WhatsApp / Telegram / Social Preview -->
  <meta property="og:title" id="og-title" content="View this Job Vacancy on TipPulse">
  <meta property="og:description" id="og-desc" content="Explore verified executive vacancies, fully funded scholarships, and direct career opportunities on TipPulse.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TipPulse">
  <meta property="og:image" content="https://tippulse.web.app/feature-graphic.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="tw-title" content="View this Job Vacancy on TipPulse">
  <meta name="twitter:description" id="tw-desc" content="Explore verified executive vacancies, fully funded scholarships, and direct career opportunities on TipPulse.">
  <meta name="twitter:image" content="https://tippulse.web.app/feature-graphic.png">
  
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow-top {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(99, 102, 241, 0.1) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }
    .glow-bottom {
      position: absolute;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(245, 158, 11, 0.06) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 2.2rem 1.8rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px -5px rgba(245, 158, 11, 0.15);
      backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Pulse logo badge */
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .logo-img {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3);
      border: 1.5px solid rgba(245, 158, 11, 0.35);
    }
    .status-beacon {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 16px;
      height: 16px;
      background: #10b981;
      border: 3px solid #111827;
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.3;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .role-preview {
      display: none;
      margin: 0.75rem 0 1rem;
      padding: 0.85rem 1rem;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 16px;
      text-align: left;
    }
    .role-preview-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }
    .role-preview-meta {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fbbf24;
      margin-top: 0.25rem;
    }

    .subtitle {
      font-size: 0.92rem;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 1.8rem;
    }

    /* Primary & Secondary CTA Buttons */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 1rem 1.25rem;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #090d16;
      font-size: 0.98rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 0.95rem 1.25rem;
      background: rgba(30, 41, 59, 0.75);
      color: #e2e8f0;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: background 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: rgba(51, 65, 85, 0.8);
    }
    .btn-secondary:active {
      transform: scale(0.98);
    }

    .play-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .footer-note {
      margin-top: 1.6rem;
      font-size: 0.75rem;
      color: #64748b;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(9, 13, 22, 0.25);
      border-top-color: #090d16;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="card">
    <div class="logo-container">
      <img src="/career-growth-icon-gold.png" alt="TipPulse Careers" class="logo-img" onerror="this.src='/app-icon.png'">
      <div class="status-beacon"></div>
    </div>

    <div class="badge">
      <span>✨ Job Vacancy & Scholarship</span>
    </div>

    <h1 id="headline">Opening in TipPulse...</h1>

    <div class="role-preview" id="role-preview">
      <div class="role-preview-title" id="role-title"></div>
      <div class="role-preview-meta" id="role-meta"></div>
    </div>

    <p class="subtitle" id="subtext">
      Redirecting you directly to this vacancy. If the app does not open automatically, tap the button below.
    </p>

    <div class="btn-stack">
      <!-- 1. Open directly in installed app -->
      <a id="btn-open-app" href="#" class="btn-primary">
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-text">Open in TipPulse App</span>
      </a>

      <!-- 2. Fallback to Google Play Store -->
      <a id="btn-play-store" href="https://play.google.com/store/apps/details?id=com.tippulse.app" class="btn-secondary">
        <svg class="play-icon" viewBox="0 0 24 24" fill="none">
          <path d="M3.6 1.7L13.8 12 3.6 22.3C3.2 21.9 3 21.3 3 20.6V3.4C3 2.7 3.2 2.1 3.6 1.7Z" fill="#2196F3"/>
          <path d="M17.2 8.6L13.8 12L3.6 1.7C4 1.3 4.7 1.2 5.3 1.5L17.2 8.6Z" fill="#4CAF50"/>
          <path d="M17.2 15.4L5.3 22.5C4.7 22.8 4 22.7 3.6 22.3L13.8 12L17.2 15.4Z" fill="#F44336"/>
          <path d="M21.4 11L17.2 8.6L13.8 12L17.2 15.4L21.4 13C22.2 12.5 22.2 11.5 21.4 11Z" fill="#FFC107"/>
        </svg>
        <span>Install from Google Play</span>
      </a>
    </div>

    <div class="footer-note">
      TipPulse • Verified Career Vacancies & Scholarships
    </div>
  </div>

  <script>
    (function() {
      // 1. Parse Career Slug / ID from URL (works for /careers/slug, /jobs/slug, ?id=slug, ?job=slug)
      function extractCareerId() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || params.get('job') || params.get('career') || params.get('slug') || params.get('career_id');
        if (id) return decodeURIComponent(id).trim();

        var path = window.location.pathname;
        var match = path.match(/\/(?:careers|jobs)\/([a-zA-Z0-9_-]+)/i);
        if (match && match[1]) return decodeURIComponent(match[1]).trim();

        if (window.location.hash) {
          var hashMatch = window.location.hash.match(/(?:careers\/|jobs\/|job=|id=)([a-zA-Z0-9_-]+)/i);
          if (hashMatch && hashMatch[1]) return decodeURIComponent(hashMatch[1]).trim();
        }
        return '';
      }

      var careerId = extractCareerId();
      var packageName = 'com.tippulse.app';
      
      // Google Play deferred install link with referrer parameter
      var referrerPart = careerId ? encodeURIComponent('utm_source=career_share&career_id=' + careerId) : '';
      var playStoreUrl = 'https://play.google.com/store/apps/details?id=' + packageName + (referrerPart ? '&referrer=' + referrerPart : '');
      
      // Custom scheme URI supported directly by AndroidManifest (tippulse://careers/...)
      var customSchemeUrl = careerId ? ('tippulse://careers/' + encodeURIComponent(careerId)) : 'tippulse://careers';
      
      // Android Intent URI (Native Android gold standard — identical to tip.html)
      // - If installed: Opens TipPulse immediately to this exact job vacancy!
      // - If not installed: Falls back seamlessly to Google Play Store!
      var androidIntentUrl = 'intent://' + (careerId ? ('careers/' + encodeURIComponent(careerId)) : 'careers') + 
        '#Intent;scheme=tippulse;package=' + packageName + 
        ';S.browser_fallback_url=' + encodeURIComponent(playStoreUrl) + ';end';

      // Update button elements
      var btnOpenApp = document.getElementById('btn-open-app');
      var btnPlayStore = document.getElementById('btn-play-store');
      var spinner = document.getElementById('btn-spinner');
      var headline = document.getElementById('headline');

      btnPlayStore.href = playStoreUrl;

      var isAndroid = /Android/i.test(navigator.userAgent);
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      var targetAppUrl = isAndroid ? androidIntentUrl : customSchemeUrl;
      btnOpenApp.href = targetAppUrl;

      // Dynamically fetch live vacancy title from Firestore REST API so any newly posted job displays its real title
      if (careerId) {
        fetch('https://firestore.googleapis.com/v1/projects/tippulse/databases/(default)/documents/job_vacancies')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (!data || !data.documents) return;
            var lower = careerId.toLowerCase();
            for (var i = 0; i < data.documents.length; i++) {
              var doc = data.documents[i];
              var f = doc.fields || {};
              var docId = (doc.name || '').split('/').pop() || '';
              var slugVal = (f.slug && f.slug.stringValue) || '';
              var titleVal = (f.title && f.title.stringValue) || '';
              var companyVal = (f.company && f.company.stringValue) || '';
              var salaryVal = (f.salaryRange && f.salaryRange.stringValue) || '';
              var titleSlug = titleVal.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

              if (docId.toLowerCase() === lower || slugVal.toLowerCase() === lower || titleSlug === lower) {
                var previewBox = document.getElementById('role-preview');
                var roleTitle = document.getElementById('role-title');
                var roleMeta = document.getElementById('role-meta');
                if (previewBox && roleTitle && titleVal) {
                  roleTitle.innerText = titleVal;
                  roleMeta.innerText = [companyVal, salaryVal].filter(Boolean).join(' • ');
                  previewBox.style.display = 'block';
                  document.title = titleVal + ' — TipPulse Careers';
                }
                break;
              }
            }
          })
          .catch(function() {});
      }

      // Automatic launch attempt on mobile (identical to tip.html)
      if (isAndroid) {
        try {
          window.location.href = androidIntentUrl;
        } catch (e) {
          window.location.href = customSchemeUrl;
        }

        setTimeout(function() {
          if (spinner) spinner.style.display = 'none';
          if (headline) headline.innerText = 'Apply in TipPulse';
        }, 2500);
      } else if (isIOS) {
        try {
          window.location.href = customSchemeUrl;
        } catch(e) {}
        setTimeout(function() {
          if (spinner) spinner.style.display = 'none';
          if (headline) headline.innerText = 'Apply in TipPulse';
        }, 2000);
      } else {
        // Desktop / Laptop
        if (spinner) spinner.style.display = 'none';
        if (headline) headline.innerText = 'View Vacancy on TipPulse';
        var subtext = document.getElementById('subtext');
        if (subtext) {
          subtext.innerText = 'Available on Android. Open in the TipPulse app or download from Google Play to view full role details and apply.';
        }
      }
    })();
  </script>
</body>
</html>
