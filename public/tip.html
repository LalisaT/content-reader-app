<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TipPulse — Premium Insights & Tips</title>
  
  <!-- Open Graph / WhatsApp / Telegram / Social Preview -->
  <meta property="og:title" content="Read this Tip on TipPulse">
  <meta property="og:description" content="Discover actionable tips, professional insights, and verified guides on TipPulse.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="TipPulse">
  <meta property="og:image" content="https://tippulse.web.app/feature-graphic.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Read this Tip on TipPulse">
  <meta name="twitter:description" content="Discover actionable tips, professional insights, and verified guides on TipPulse.">
  <meta name="twitter:image" content="https://tippulse.web.app/feature-graphic.png">
  
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow-top {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(217, 119, 6, 0.08) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }
    .glow-bottom {
      position: absolute;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.12) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(40px);
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 2.2rem 1.8rem;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 35px -5px rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Pulse logo badge */
    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .logo-img {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }
    .status-beacon {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 16px;
      height: 16px;
      background: #10b981;
      border: 3px solid #111827;
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 100px;
      margin-bottom: 0.9rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 0.6rem;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 0.88rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 1.8rem;
      padding: 0 0.5rem;
    }

    /* Action Buttons */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 1rem 1.4rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5);
      transition: all 0.2s ease;
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 0.95rem 1.4rem;
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:active {
      transform: scale(0.98);
    }

    .play-icon {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    .footer-note {
      margin-top: 1.4rem;
      font-size: 0.72rem;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="glow-top"></div>
  <div class="glow-bottom"></div>

  <div class="card">
    <div class="logo-container">
      <img src="/app-icon.png" alt="TipPulse Logo" class="logo-img" onerror="this.src='/favicon.png'">
      <div class="status-beacon"></div>
    </div>

    <div class="badge">
      <span>✨ Live Insight</span>
    </div>

    <h1 id="headline">Opening in TipPulse...</h1>
    <p class="subtitle" id="subtext">
      Redirecting you directly to this tip. If the app does not open automatically, tap the button below.
    </p>

    <div class="btn-stack">
      <!-- 1. Open directly in installed app -->
      <a id="btn-open-app" href="#" class="btn-primary">
        <span class="spinner" id="btn-spinner"></span>
        <span id="btn-text">Open in TipPulse App</span>
      </a>

      <!-- 2. Fallback to Google Play Store -->
      <a id="btn-play-store" href="https://play.google.com/store/apps/details?id=com.tippulse.app" class="btn-secondary">
        <svg class="play-icon" viewBox="0 0 24 24" fill="none">
          <path d="M3.6 1.7L13.8 12 3.6 22.3C3.2 21.9 3 21.3 3 20.6V3.4C3 2.7 3.2 2.1 3.6 1.7Z" fill="#2196F3"/>
          <path d="M17.2 8.6L13.8 12L3.6 1.7C4 1.3 4.7 1.2 5.3 1.5L17.2 8.6Z" fill="#4CAF50"/>
          <path d="M17.2 15.4L5.3 22.5C4.7 22.8 4 22.7 3.6 22.3L13.8 12L17.2 15.4Z" fill="#F44336"/>
          <path d="M21.4 11L17.2 8.6L13.8 12L17.2 15.4L21.4 13C22.2 12.5 22.2 11.5 21.4 11Z" fill="#FFC107"/>
        </svg>
        <span>Install from Google Play</span>
      </a>
    </div>

    <div class="footer-note">
      TipPulse • Verified Daily Tips & Guides
    </div>
  </div>

  <script>
    (function() {
      // 1. Parse Article ID from URL
      function extractArticleId() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || params.get('article') || params.get('article_id') || params.get('post');
        if (id) return decodeURIComponent(id);

        var path = window.location.pathname;
        var match = path.match(/\/(?:article|tip)\/([a-zA-Z0-9_-]+)/i);
        if (match && match[1]) return decodeURIComponent(match[1]);

        if (window.location.hash) {
          var hashMatch = window.location.hash.match(/(?:article\/|id=)([a-zA-Z0-9_-]+)/i);
          if (hashMatch && hashMatch[1]) return decodeURIComponent(hashMatch[1]);
        }
        return '';
      }

      var articleId = extractArticleId();
      var packageName = 'com.tippulse.app';
      
      // Google Play deferred install link with referrer parameter
      var referrerPart = articleId ? encodeURIComponent('utm_source=app_share&article_id=' + articleId) : '';
      var playStoreUrl = 'https://play.google.com/store/apps/details?id=' + packageName + (referrerPart ? '&referrer=' + referrerPart : '');
      
      // Custom scheme URI supported directly by AndroidManifest
      var customSchemeUrl = articleId ? ('tippulse://article/' + encodeURIComponent(articleId)) : 'tippulse://home';
      
      // Android Intent URI (Native Android gold standard)
      // When executed on Android:
      // - If installed: Opens TipPulse immediately!
      // - If not installed: Falls back seamlessly to Google Play Store!
      var androidIntentUrl = 'intent://' + (articleId ? ('article/' + encodeURIComponent(articleId)) : 'home') + 
        '#Intent;scheme=tippulse;package=' + packageName + 
        ';S.browser_fallback_url=' + encodeURIComponent(playStoreUrl) + ';end';

      // Update button elements
      var btnOpenApp = document.getElementById('btn-open-app');
      var btnPlayStore = document.getElementById('btn-play-store');
      var spinner = document.getElementById('btn-spinner');
      var headline = document.getElementById('headline');

      btnPlayStore.href = playStoreUrl;

      var isAndroid = /Android/i.test(navigator.userAgent);
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      var targetAppUrl = isAndroid ? androidIntentUrl : customSchemeUrl;
      btnOpenApp.href = targetAppUrl;

      // Handle direct tap on "Open in TipPulse App"
      btnOpenApp.addEventListener('click', function(e) {
        // Allow default link navigation to intent/scheme
      });

      // Automatic launch attempt on mobile
      if (isAndroid) {
        // Attempt immediate dispatch via Android Intent
        try {
          window.location.href = androidIntentUrl;
        } catch (e) {
          window.location.href = customSchemeUrl;
        }

        // After 2.5 seconds, if the user is still on this web page (e.g. app was not installed and browser didn't redirect):
        setTimeout(function() {
          if (spinner) spinner.style.display = 'none';
          if (headline) headline.innerText = 'Explore in TipPulse';
        }, 2500);
      } else if (isIOS) {
        // iOS fallback
        try {
          window.location.href = customSchemeUrl;
        } catch(e) {}
        setTimeout(function() {
          if (spinner) spinner.style.display = 'none';
          if (headline) headline.innerText = 'Explore in TipPulse';
        }, 2000);
      } else {
        // Desktop / Laptop
        if (spinner) spinner.style.display = 'none';
        if (headline) headline.innerText = 'Read on TipPulse';
        var subtext = document.getElementById('subtext');
        if (subtext) {
          subtext.innerText = 'Available now on Android. Download TipPulse from Google Play to access all curated insights.';
        }
      }
    })();
  </script>
</body>
</html>
