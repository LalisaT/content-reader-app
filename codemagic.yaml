workflows:
  android-capacitor-release:
    name: TipPulse Android Play Store Release (AAB & APK)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
      vars:
        KEYSTORE_BASE64: ""
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies and build web assets
        script: |
          npm install
          npm run build
          npx cap copy android
      - name: Configure Android SDK and Signing Keystore
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/android/app/my-release-key.jks"
          cat <<EOF > "$CM_BUILD_DIR/android/keystore.properties"
          storeFile=my-release-key.jks
          storePassword=15739482
          keyAlias=my-key-alias
          keyPassword=15739482
          EOF
      - name: Build Signed Android Release AAB & APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease -x lint -x lintVitalRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/mapping.txt
