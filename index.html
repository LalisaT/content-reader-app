<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="TipPulse - Curated daily tips, tech guides, productivity hacks, and lifestyle articles." />
    <title>TipPulse - Daily Tips & News Reader</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
      /* Clean white background matching native splash seamlessly */
      html, body {
        background-color: #ffffff;
        color: #0f172a;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
      }
      .app-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #ffffff;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      .app-splash-logo {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 30px -6px rgba(2, 132, 199, 0.25);
        margin-bottom: 20px;
        padding: 8px;
        box-sizing: border-box;
      }
      .app-splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 16px;
      }
      .app-splash-title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #0284c7;
        margin: 0;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased select-none font-sans overflow-x-hidden min-h-screen">
    <div id="root">
      <!-- Clean Minimal Startup: Logo and Name Only -->
      <div class="app-splash-container">
        <div class="app-splash-logo">
          <img src="/app-icon.png" alt="TipPulse Logo" />
        </div>
        <h1 class="app-splash-title">TipPulse</h1>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
