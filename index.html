<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="description" content="TipPulse - Curated daily tips, tech guides, productivity hacks, and lifestyle articles." />
    <title>TipPulse - Daily Tips & News Reader</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <style>
      /* Zero white flash: dark background applied immediately */
      html, body {
        background-color: #090d16;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at center, #111827 0%, #090d16 100%);
      }
      .app-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 20px;
      }
      .app-splash-logo {
        position: relative;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
        margin-bottom: 24px;
        padding: 8px;
        box-sizing: border-box;
      }
      .app-splash-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 12px;
      }
      .app-splash-spinner-ring {
        position: absolute;
        inset: -6px;
        border-radius: 26px;
        border: 2px solid transparent;
        border-top-color: #38bdf8;
        border-right-color: #818cf8;
        animation: splash-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      .app-splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #ffffff;
        margin: 0 0 6px 0;
      }
      .app-splash-tagline {
        font-size: 12px;
        color: #94a3b8;
        margin: 0 0 28px 0;
        font-weight: 500;
      }
      .app-splash-circle-loader {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-right-color: #818cf8;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 antialiased select-none font-sans overflow-x-hidden min-h-screen">
    <div id="root">
      <!-- Instant Startup Loading Screen: Eliminates blank white screen immediately -->
      <div class="app-splash-container">
        <div class="app-splash-logo">
          <div class="app-splash-spinner-ring"></div>
          <img src="/app-icon.png" alt="TipPulse Logo" />
        </div>
        <h1 class="app-splash-title">TipPulse</h1>
        <p class="app-splash-tagline">Daily Educational & Practical Tips</p>
        <div class="app-splash-circle-loader"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
